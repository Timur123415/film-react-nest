events {}

http {
    include       mime.types;
    default_type  application/octet-stream;

    server {
        listen 80;

        location /content/ {
            proxy_pass http://afisha-backend:3000;
        }

        location /api/ {
            proxy_pass http://afisha-backend:3000/api/;
            proxy_set_header Host $host;
        }

        location / {
            root /app/public;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}